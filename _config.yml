title: Pack 232 Codex
description: Cub Scout Pack 232 — Leader Knowledge Base
url: https://codex.pack232.org
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-titles-from-headings
  - jekyll-relative-links

optional_front_matter:
  remove_originals: true

titles_from_headings:
  enabled: true
  strip_title: true

relative_links:
  enabled: true
  collections: true

defaults:
  - scope:
      path: "docs"
    values:
      nav_exclude: true
  - scope:
      path: "roles"
    values:
      nav_exclude: true

exclude:
  - roles/*/agent
  - docs/tmp
  - docs/_archive
  - Gemfile.lock
