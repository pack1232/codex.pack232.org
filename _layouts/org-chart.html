---
layout: default
---

<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({
    startOnLoad: true,
    securityLevel: 'loose',
    theme: 'base',
    themeVariables: {
      primaryColor: '#e8f4e8',
      primaryBorderColor: '#2d6a2e',
      lineColor: '#555',
      fontSize: '14px'
    },
    flowchart: {
      useMaxWidth: true,
      htmlLabels: true,
      curve: 'basis'
    }
  });
</script>

<style>
  .org-chart-container {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 1rem 0;
  }
  .org-chart-legend {
    display: flex;
    gap: 2rem;
    margin-bottom: 1rem;
    font-size: 0.9rem;
    flex-wrap: wrap;
  }
  .org-chart-legend span {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .legend-filled {
    display: inline-block;
    width: 1rem;
    height: 1rem;
    background: #e8f4e8;
    border: 2px solid #2d6a2e;
    border-radius: 3px;
  }
  .legend-vacant {
    display: inline-block;
    width: 1rem;
    height: 1rem;
    background: #f5f5f5;
    border: 2px dashed #999;
    border-radius: 3px;
  }
  .legend-core {
    display: inline-block;
    width: 1rem;
    height: 1rem;
    background: #c8e6c9;
    border: 3px solid #1b5e20;
    border-radius: 3px;
  }
</style>

<div class="org-chart-legend">
  <span><span class="legend-core"></span> Core Leadership (Core 3)</span>
  <span><span class="legend-filled"></span> Filled Position</span>
  <span><span class="legend-vacant"></span> Vacant — Volunteer Needed</span>
</div>

<div class="org-chart-container">
{{ content }}
</div>
