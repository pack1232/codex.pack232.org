# Tasks this role is responsible for or participates in.
#
# Schema:
#   id:           Unique task identifier (kebab-case)
#   name:         Display name
#   type:         program|financial|fundraising|administrative|recruitment|outdoor|service|recognition|training
#   frequency:    monthly|annual|as-needed
#   months:       List of month numbers [1-12] or null (every month)
#   timing_note:  When within the month/season
#   role:         owner|involved (this role's relationship to the task)
#   description:  What the task is
#   tags:         Optional labels for filtering

tasks:

  - id: pack-meeting
    name: "Pack Meeting"
    type: program
    frequency: monthly
    months: null
    timing_note: "Consistent day each month (e.g. 3rd Monday); set at annual planning conference"
    role: involved
    description: >
      Monthly pack meeting. All dens and families attend. Approximately one hour. Includes flag ceremony, program, advancement recognition, and closing.
    tags: ['pack-meeting', 'all-hands']

  - id: district-roundtable
    name: "District Roundtable"
    type: training
    frequency: monthly
    months: null
    timing_note: "Check Twin Rivers Council / Fort Orange District for exact schedule"
    role: involved
    description: >
      Monthly Fort Orange District Cub Scout leaders' roundtable. Provides program ideas, council updates, and peer learning with leaders from other packs.
    tags: ['training', 'district']

  - id: advancement-award-processing
    name: "Monthly Advancement Processing"
    type: recognition
    frequency: monthly
    months: null
    timing_note: "Before each pack meeting — awards must be in hand before the meeting"
    role: involved
    description: >
      Advancement Chair pulls completed advancement data from Scoutbook, purchases badges and awards from the Scout Shop, and prepares awards for presentation at the pack meeting. Submits advancement reports to Twin Rivers Council.
    tags: ['advancement', 'scoutbook']

  - id: den-meetings
    name: "Den Meetings"
    type: program
    frequency: monthly
    months: null
    timing_note: "Lions: 1x/month. Tigers and above: typically 2x/month."
    role: owner
    description: >
      Den leaders conduct 1–2 den meetings per month. Den leaders update Scoutbook with completed advancement requirements promptly after each meeting.
    tags: ['den', 'program', 'scoutbook']

  - id: scoutbook-advancement-update
    name: "Scoutbook Advancement Updates"
    type: administrative
    frequency: monthly
    months: null
    timing_note: "Within 1–2 days of each den meeting"
    role: owner
    description: >
      Den leaders mark completed adventure requirements in Scoutbook promptly so the Advancement Chair can order awards and parents can see their Scout's progress.
    tags: ['scoutbook', 'advancement', 'den']

  - id: annual-program-planning-conference
    name: "Annual Program Planning Conference"
    type: program
    frequency: annual
    months: [7]
    timing_note: "July or August; before the Scouting year begins"
    role: involved
    description: >
      Annual meeting to set the pack's program calendar for the coming Scouting year. Sets pack meeting dates, themes, major events, and assigns activity coordinators.
    tags: ['planning', 'annual']

  - id: scout-rank-transitions
    name: "Scout Rank Transitions in Scoutbook"
    type: administrative
    frequency: annual
    months: [6, 7]
    timing_note: "June–July: update Scoutbook as Scouts move to the next rank's den"
    role: owner
    description: >
      Den leaders formally transition Scouts to the next rank (Wolves → Bears, etc.) in Scoutbook. Cubmaster coordinates crossover between den leaders.
    tags: ['scoutbook', 'administrative', 'transitions']

  - id: school-night-recruitment
    name: "School-Night Recruitment Event"
    type: recruitment
    frequency: annual
    months: [9]
    timing_note: "Early-to-mid September, timed to school start"
    role: involved
    description: >
      Primary annual Scout recruitment event held at Glenmont Elementary. Cubmaster presents the Cub Scout program; families sign up on the spot. Follow up within 48 hours.
    tags: ['recruitment', 'annual', 'kickoff']

  - id: holiday-pack-meeting
    name: "Holiday Pack Meeting"
    type: program
    frequency: annual
    months: [12]
    timing_note: "December pack meeting"
    role: involved
    description: >
      Holiday-themed pack meeting. May include skits, songs, advancement ceremonies, and holiday celebration activities.
    tags: ['program', 'holiday', 'annual']

  - id: aol-crossover-planning
    name: "Arrow of Light Crossover: Troop Coordination"
    type: recognition
    frequency: annual
    months: [12]
    timing_note: "December planning for January/February crossover"
    role: involved
    description: >
      Cubmaster and AOL den leader confirm which Scouts BSA troop(s) AOL Scouts will join. Plan crossover ceremony with Scoutmaster and troop youth leaders. Target January or February so Scouts can attend troop campouts before summer camp.
    tags: ['crossover', 'aol', 'recognition', 'annual']

  - id: aol-crossover-ceremony
    name: "Arrow of Light Crossover Ceremony"
    type: recognition
    frequency: annual
    months: [1, 2]
    timing_note: "January target (February latest); at a pack meeting"
    role: involved
    description: >
      Scouts who have earned the Arrow of Light badge cross over to a Scouts BSA troop. Ceremony involves Scoutmaster and troop youth leaders. Advancement Chair orders AOL badges and certificates well in advance.
    tags: ['crossover', 'aol', 'recognition', 'annual', 'ceremony']

  - id: new-family-retention-checkin
    name: "New Family Retention Check-In"
    type: recruitment
    frequency: annual
    months: [1]
    timing_note: "January — 4 months after September recruitment"
    role: involved
    description: >
      Membership Chair checks in with families who joined in September — are they engaged? Flag any at risk of dropping out and initiate personal outreach.
    tags: ['retention', 'recruitment', 'annual']

  - id: spring-hike
    name: "Spring Hike"
    type: outdoor
    frequency: annual
    months: [4]
    timing_note: "April — all dens attend"
    role: involved
    description: >
      Annual spring hike open to all dens and families. Coordinator: Dave Coup.
    tags: ['hike', 'outdoor', 'annual']

  - id: spring-service-project
    name: "Spring Service Project"
    type: service
    frequency: as-needed
    months: [4]
    timing_note: "Optional — good month for a neighborhood or park cleanup"
    role: involved
    description: >
      Optional spring service project (e.g., park cleanup, trail maintenance, school grounds cleanup). Service Chair coordinates with the beneficiary and plans logistics.
    tags: ['service', 'outdoor', 'spring']

  - id: final-advancement-push
    name: "Final Advancement Push"
    type: recognition
    frequency: annual
    months: [5]
    timing_note: "May — ensure all Scouts complete rank badges before year-end"
    role: involved
    description: >
      Advancement Chair and den leaders identify Scouts close to completing their rank badge and work with families to complete any remaining requirements before the end of year.
    tags: ['advancement', 'recognition', 'annual']

  - id: end-of-year-pack-meeting
    name: "End-of-Year Pack Meeting"
    type: program
    frequency: annual
    months: [5]
    timing_note: "May pack meeting — celebrate the year's accomplishments"
    role: involved
    description: >
      Final pack meeting of the Scouting year. Recognize all Scouts with remaining advancement awards, celebrate the year, thank volunteers, and preview next year.
    tags: ['program', 'annual', 'celebration']

  - id: retention-outreach
    name: "End-of-Year Retention Outreach"
    type: recruitment
    frequency: annual
    months: [5]
    timing_note: "Before families disengage for summer"
    role: involved
    description: >
      Membership Chair and den leaders identify families showing low engagement and make personal outreach to encourage re-enrollment for the coming year.
    tags: ['retention', 'recruitment', 'annual']

  - id: new-scout-onboarding
    name: "New Scout Mid-Year Onboarding"
    type: recruitment
    frequency: as-needed
    months: null
    timing_note: "As new Scouts join at any point during the year"
    role: involved
    description: >
      Scouts can join at any time. Membership Chair connects new families to their den leader, provides welcome packet, and ensures health form and registration are complete.
    tags: ['recruitment', 'onboarding']
