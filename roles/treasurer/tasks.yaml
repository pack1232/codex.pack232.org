# Tasks this role is responsible for or participates in.
#
# Schema:
#   id:           Unique task identifier (kebab-case)
#   name:         Display name
#   type:         program|financial|fundraising|administrative|recruitment|outdoor|service|recognition|training
#   frequency:    monthly|annual|as-needed
#   months:       List of month numbers [1-12] or null (every month)
#   timing_note:  When within the month/season
#   role:         owner|involved (this role's relationship to the task)
#   description:  What the task is
#   tags:         Optional labels for filtering

tasks:

  - id: committee-meeting
    name: "Committee Meeting"
    type: administrative
    frequency: monthly
    months: null
    timing_note: "Same week as or adjacent to the pack meeting"
    role: involved
    description: >
      Monthly pack committee meeting. Committee Chair presides. Includes treasurer's report, Cubmaster's report, committee member updates, old and new business, upcoming event review.
    tags: ['committee', 'governance']

  - id: treasurer-account-reconciliation
    name: "Monthly Account Reconciliation"
    type: financial
    frequency: monthly
    months: null
    timing_note: "Before the committee meeting each month"
    role: owner
    description: >
      Treasurer reconciles all pack accounts (Broadview Credit Union, PayPal, Square, Venmo) in QuickBooks Online. Prepares monthly financial report for committee meeting.
    tags: ['financial', 'recurring']

  - id: prior-year-financial-report
    name: "Prior-Year Annual Financial Report"
    type: financial
    frequency: annual
    months: [7]
    timing_note: "July — close out the prior Scouting year finances"
    role: owner
    description: >
      Treasurer prepares the prior-year annual financial report summarizing all revenue, expenses, and account balances. Presented to the committee.
    tags: ['financial', 'annual', 'reporting']

  - id: draft-annual-budget
    name: "Draft Upcoming-Year Budget"
    type: financial
    frequency: annual
    months: [7, 8]
    timing_note: "Draft in July, finalize in August, present for approval in September"
    role: owner
    description: >
      Treasurer drafts the pack's budget for the coming Scouting year based on prior-year actuals, planned activities, expected enrollment, and popcorn revenue projections.
    tags: ['financial', 'annual', 'budget']

  - id: annual-budget-approval
    name: "Annual Budget Approval"
    type: financial
    frequency: annual
    months: [9]
    timing_note: "At the September committee meeting"
    role: involved
    description: >
      Treasurer presents the proposed annual budget to the committee. Committee votes to approve. Budget governs all pack spending for the Scouting year.
    tags: ['financial', 'annual', 'governance']

  - id: dues-collection-setup
    name: "Annual Dues Collection"
    type: financial
    frequency: annual
    months: [9]
    timing_note: "Open collection at the September pack meeting"
    role: owner
    description: >
      Treasurer opens WooCommerce products for annual Scout dues collection. Accepts payment via WooCommerce (online), Square (in-person card), Venmo, or check.
    tags: ['financial', 'dues', 'annual']

  - id: popcorn-order-submission
    name: "Popcorn Order Submission to Council"
    type: fundraising
    frequency: annual
    months: [10]
    timing_note: "By the council's deadline — check trcscouting.org annually"
    role: involved
    description: >
      Popcorn Kernel collects all Scout take-order forms, enters the pack's order into the Trail's End / Pecatonica system, and submits to Twin Rivers Council District Office by the annual deadline.
    tags: ['popcorn', 'fundraising', 'annual', 'deadline']

  - id: popcorn-money-collection
    name: "Popcorn Money Collection & Turnover"
    type: fundraising
    frequency: annual
    months: [10]
    timing_note: "Concurrent with order submission"
    role: involved
    description: >
      Popcorn Kernel collects popcorn proceeds from Scout families. All money turned over to the Treasurer. Kernel provides per-Scout sales data for Scout account credits.
    tags: ['popcorn', 'financial', 'annual']

  - id: scout-account-credits
    name: "Scout Account Credits from Popcorn"
    type: financial
    frequency: annual
    months: [11]
    timing_note: "After popcorn proceeds are received from the Kernel"
    role: owner
    description: >
      Treasurer credits individual Scout accounts in QuickBooks based on per-Scout popcorn sales data provided by the Popcorn Kernel.
    tags: ['financial', 'scout-accounts', 'popcorn', 'annual']

  - id: popcorn-donation-in-lieu-invoicing
    name: "Popcorn Donation-in-Lieu Invoicing"
    type: financial
    frequency: annual
    months: [11]
    timing_note: "After Scout account credits are calculated"
    role: owner
    description: >
      Treasurer invoices Scout families who did not meet the popcorn target for "donation in lieu" — additional dues owed to make up the fundraising shortfall.
    tags: ['financial', 'popcorn', 'dues', 'annual']

  - id: recharter-submission
    name: "Recharter Submission to Council"
    type: administrative
    frequency: annual
    months: [12]
    timing_note: "December deadline — confirm exact date with Twin Rivers Council each year"
    role: involved
    description: >
      Committee Chair submits completed recharter to Twin Rivers Council. Charter Org Rep signs. Treasurer pays recharter fees.
    tags: ['recharter', 'administrative', 'annual', 'deadline']

  - id: quickbooks-license-renewal
    name: "QuickBooks / TechSoup License Renewal"
    type: financial
    frequency: annual
    months: [12]
    timing_note: "Check renewal date annually — may vary"
    role: owner
    description: >
      Treasurer renews the QuickBooks Online license through TechSoup (nonprofit discount program) for the coming year.
    tags: ['financial', 'administrative', 'annual']

  - id: budget-review
    name: "Mid-Year Budget Review"
    type: financial
    frequency: annual
    months: [4]
    timing_note: "April committee meeting"
    role: owner
    description: >
      Treasurer presents actuals vs. budget review for the year to date. Identifies variances and any risks to year-end financial position.
    tags: ['financial', 'annual', 'budget']

  - id: financial-year-close
    name: "Prior-Year Financial Close"
    type: financial
    frequency: annual
    months: [6, 7]
    timing_note: "Begin in June; complete by July"
    role: owner
    description: >
      Treasurer finalizes the prior Scouting year's financial close in QuickBooks: reconcile all accounts, close the year, and prepare for the annual report in July.
    tags: ['financial', 'annual']

  - id: reimbursement-processing
    name: "Leader Reimbursement Processing"
    type: financial
    frequency: as-needed
    months: null
    timing_note: "As expenses are submitted; Committee Chair approves before Treasurer pays"
    role: owner
    description: >
      Leaders submit receipts for pack-related expenses. Committee Chair approves. Treasurer issues reimbursement check from Broadview account.
    tags: ['financial', 'reimbursements']

  - id: nys-sales-tax-exemption
    name: "NY Sales Tax Exemption on Pack Purchases"
    type: financial
    frequency: as-needed
    months: null
    timing_note: "Any time a significant pack purchase is made"
    role: owner
    description: >
      Pack 232 is exempt from New York State sales tax on pack purchases. Treasurer provides the tax-exempt certificate to leaders before significant purchases. Keep receipt showing tax was not charged.
    tags: ['financial', 'administrative', 'tax']
