# Tasks this role is responsible for or participates in.
#
# Schema:
#   id:           Unique task identifier (kebab-case)
#   name:         Display name
#   type:         program|financial|fundraising|administrative|recruitment|outdoor|service|recognition|training
#   frequency:    monthly|annual|as-needed
#   months:       List of month numbers [1-12] or null (every month)
#   timing_note:  When within the month/season
#   role:         owner|involved (this role's relationship to the task)
#   description:  What the task is
#   tags:         Optional labels for filtering

tasks:

  - id: committee-meeting
    name: "Committee Meeting"
    type: administrative
    frequency: monthly
    months: null
    timing_note: "Same week as or adjacent to the pack meeting"
    role: involved
    description: >
      Monthly pack committee meeting. Committee Chair presides. Includes treasurer's report, Cubmaster's report, committee member updates, old and new business, upcoming event review.
    tags: ['committee', 'governance']

  - id: popcorn-unit-registration
    name: "Register Unit for Popcorn Sale"
    type: fundraising
    frequency: annual
    months: [8]
    timing_note: "Before the council popcorn kickoff in September"
    role: owner
    description: >
      Popcorn Kernel registers the pack with Twin Rivers Council for the annual popcorn sale and gains access to the Trail's End / Pecatonica ordering system.
    tags: ['popcorn', 'fundraising', 'annual']

  - id: popcorn-council-kickoff
    name: "Popcorn Kernel Attends Council Kickoff"
    type: fundraising
    frequency: annual
    months: [9]
    timing_note: "Twin Rivers Council hosts kickoff — check trcscouting.org for date"
    role: owner
    description: >
      Popcorn Kernel attends the Twin Rivers Council annual popcorn kickoff meeting. Picks up sales materials, learns about prize program, and gets unit-level targets.
    tags: ['popcorn', 'fundraising', 'annual']

  - id: popcorn-pack-kickoff
    name: "Popcorn Pack Kickoff Presentation"
    type: fundraising
    frequency: annual
    months: [9]
    timing_note: "At the September pack meeting"
    role: owner
    description: >
      Popcorn Kernel presents the popcorn sale to all Scouts and families at the September pack meeting. Explains goals, prizes, Scout account credits, take-order forms, and Show and Sell schedule.
    tags: ['popcorn', 'fundraising', 'annual']

  - id: popcorn-show-and-sells
    name: "Popcorn Show & Sells"
    type: fundraising
    frequency: annual
    months: [9, 10]
    timing_note: "Multiple weekends in September–October; Kernel schedules with merchants"
    role: owner
    description: >
      Scouts staff tables in front of local merchants (grocery stores, etc.) and sell popcorn directly to customers. Kernel schedules shifts and coordinates inventory.
    tags: ['popcorn', 'fundraising', 'annual']

  - id: popcorn-order-submission
    name: "Popcorn Order Submission to Council"
    type: fundraising
    frequency: annual
    months: [10]
    timing_note: "By the council's deadline — check trcscouting.org annually"
    role: owner
    description: >
      Popcorn Kernel collects all Scout take-order forms, enters the pack's order into the Trail's End / Pecatonica system, and submits to Twin Rivers Council District Office by the annual deadline.
    tags: ['popcorn', 'fundraising', 'annual', 'deadline']

  - id: popcorn-money-collection
    name: "Popcorn Money Collection & Turnover"
    type: fundraising
    frequency: annual
    months: [10]
    timing_note: "Concurrent with order submission"
    role: owner
    description: >
      Popcorn Kernel collects popcorn proceeds from Scout families. All money turned over to the Treasurer. Kernel provides per-Scout sales data for Scout account credits.
    tags: ['popcorn', 'financial', 'annual']

  - id: popcorn-pickup-distribution
    name: "Popcorn Pickup & Distribution"
    type: fundraising
    frequency: annual
    months: [11]
    timing_note: "November — after council distributes popcorn to district"
    role: owner
    description: >
      Popcorn Kernel picks up the pack's popcorn from the district, sorts it by Scout, and distributes to Scout families at a pack meeting or designated pickup.
    tags: ['popcorn', 'fundraising', 'annual']

  - id: scout-account-credits
    name: "Scout Account Credits from Popcorn"
    type: financial
    frequency: annual
    months: [11]
    timing_note: "After popcorn proceeds are received from the Kernel"
    role: involved
    description: >
      Treasurer credits individual Scout accounts in QuickBooks based on per-Scout popcorn sales data provided by the Popcorn Kernel.
    tags: ['financial', 'scout-accounts', 'popcorn', 'annual']

  - id: popcorn-year-end-wrap
    name: "Popcorn Kernel Attends Year-End Wrap"
    type: fundraising
    frequency: annual
    months: [11]
    timing_note: "Twin Rivers Council hosts wrap meeting — check trcscouting.org for date"
    role: owner
    description: >
      Popcorn Kernel attends the council's year-end popcorn wrap meeting to close out the sale season, reconcile any issues, and prepare for next year.
    tags: ['popcorn', 'fundraising', 'annual']

  - id: popcorn-donation-in-lieu-invoicing
    name: "Popcorn Donation-in-Lieu Invoicing"
    type: financial
    frequency: annual
    months: [11]
    timing_note: "After Scout account credits are calculated"
    role: involved
    description: >
      Treasurer invoices Scout families who did not meet the popcorn target for "donation in lieu" — additional dues owed to make up the fundraising shortfall.
    tags: ['financial', 'popcorn', 'dues', 'annual']
