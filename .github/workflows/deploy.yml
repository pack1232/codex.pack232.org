name: Validate & Export Codex

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Content Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate content schemas
        run: python3 scripts/validate-content.py

  export-codex:
    name: Export Codex Content Pack
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Export content pack
        run: python3 scripts/export-codex.py -o dist/codex

      - name: Upload Codex artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-content-pack
          path: dist/codex/
          retention-days: 30
