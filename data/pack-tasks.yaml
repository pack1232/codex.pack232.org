# Pack 232 Annual Tasks & Events
# ================================
# All tasks, events, and recurring responsibilities the pack must accomplish each year.
# Covers the Scouting year: July (month 7) through June (month 6).
#
# SCHEMA
# ------
# id:           Unique slug identifier (kebab-case)
# name:         Display name
# type:         Category — one of:
#                 program       Pack meetings, ceremonies, den activities, major pack events
#                 financial     Budget, reconciliation, dues collection, reimbursements
#                 fundraising   Popcorn sale, money-earning activities
#                 administrative Recharter, records, health forms, communications, facilities
#                 recruitment   Sign-ups, new family onboarding, retention
#                 outdoor       Camping, hikes, outdoor activities
#                 service       Service projects and Good Turns
#                 recognition   Awards, advancement ceremonies, crossovers
#                 training      YPT, position-specific training, roundtables
# frequency:    How often — one of: monthly | annual | as-needed
# months:       List of month numbers (1=Jan … 12=Dec) when this occurs.
#               null means every month (use with frequency: monthly).
#               Scouting year starts in July (7).
# timing_note:  Free-text clarification on timing within the month or conditions
# owner:        Primary role responsible — matches folder name in roles/
#               Special values: pinewood-derby-team, blue-gold-team
# roles:        All roles involved (array) — owner is typically first
# description:  What this task/event is
# tags:         Optional extra labels for filtering (array)

meta:
  scouting_year: "July–June"
  pack: "Pack 232"
  council: "Twin Rivers Council"
  district: "Fort Orange District"
  charter_org: "Glenmont Elementary PTA"

# ─────────────────────────────────────────────
# ROLE REFERENCE (maps owner IDs to display names)
# ─────────────────────────────────────────────
role_display:
  cubmaster: "Cubmaster"
  assistant-cubmaster: "Assistant Cubmaster"
  committee-chair: "Committee Chair"
  treasurer: "Treasurer"
  charter-org-rep: "Charter Org Rep"
  secretary: "Secretary"
  den-leader: "Den Leader"
  advancement-chair: "Advancement Chair"
  activity-chair: "Activities Chair"
  membership-chair: "Membership Chair"
  fundraising-chair: "Fundraising Chair"
  marketing-chair: "Marketing / Social Media Chair"
  popcorn-kernel: "Popcorn Kernel"
  service-chair: "Service Chair"
  den-chief: "Den Chief"
  pinewood-derby-team: "Pinewood Derby Team"
  blue-gold-team: "Blue & Gold Team"

# ─────────────────────────────────────────────
# TASKS & EVENTS
# ─────────────────────────────────────────────
tasks:

  # ══════════════════════════════════════
  # MONTHLY RECURRING
  # ══════════════════════════════════════

  - id: pack-meeting
    name: "Pack Meeting"
    type: program
    frequency: monthly
    months: null
    timing_note: "Consistent day each month (e.g. 3rd Monday); set at annual planning conference"
    owner: cubmaster
    roles: [cubmaster, assistant-cubmaster, den-leader, advancement-chair, activity-chair]
    description: >
      Monthly pack meeting. All dens and families attend. Approximately one hour.
      Includes flag ceremony, program, advancement recognition, and closing.
    tags: [pack-meeting, all-hands]

  - id: committee-meeting
    name: "Committee Meeting"
    type: administrative
    frequency: monthly
    months: null
    timing_note: "Same week as or adjacent to the pack meeting"
    owner: committee-chair
    roles: [committee-chair, treasurer, secretary, cubmaster, advancement-chair, activity-chair, membership-chair, popcorn-kernel, marketing-chair, service-chair, fundraising-chair]
    description: >
      Monthly pack committee meeting. Committee Chair presides. Includes treasurer's report,
      Cubmaster's report, committee member updates, old and new business, upcoming event review.
    tags: [committee, governance]

  - id: district-roundtable
    name: "District Roundtable"
    type: training
    frequency: monthly
    months: null
    timing_note: "Check Twin Rivers Council / Fort Orange District for exact schedule"
    owner: cubmaster
    roles: [cubmaster, den-leader, assistant-cubmaster]
    description: >
      Monthly Fort Orange District Cub Scout leaders' roundtable. Provides program ideas,
      council updates, and peer learning with leaders from other packs.
    tags: [training, district]

  - id: treasurer-account-reconciliation
    name: "Monthly Account Reconciliation"
    type: financial
    frequency: monthly
    months: null
    timing_note: "Before the committee meeting each month"
    owner: treasurer
    roles: [treasurer]
    description: >
      Treasurer reconciles all pack accounts (Broadview Credit Union, PayPal, Square, Venmo)
      in QuickBooks Online. Prepares monthly financial report for committee meeting.
    tags: [financial, recurring]

  - id: advancement-award-processing
    name: "Monthly Advancement Processing"
    type: recognition
    frequency: monthly
    months: null
    timing_note: "Before each pack meeting — awards must be in hand before the meeting"
    owner: advancement-chair
    roles: [advancement-chair, den-leader]
    description: >
      Advancement Chair pulls completed advancement data from Scoutbook, purchases badges
      and awards from the Scout Shop, and prepares awards for presentation at the pack meeting.
      Submits advancement reports to Twin Rivers Council.
    tags: [advancement, scoutbook]

  - id: den-meetings
    name: "Den Meetings"
    type: program
    frequency: monthly
    months: null
    timing_note: "Lions: 1x/month. Tigers and above: typically 2x/month."
    owner: den-leader
    roles: [den-leader, assistant-cubmaster, den-chief]
    description: >
      Den leaders conduct 1–2 den meetings per month. Den leaders update Scoutbook with
      completed advancement requirements promptly after each meeting.
    tags: [den, program, scoutbook]

  - id: committee-meeting-notice
    name: "Committee Meeting Notice & Agenda"
    type: administrative
    frequency: monthly
    months: null
    timing_note: "2–3 days before the committee meeting"
    owner: secretary
    roles: [secretary, committee-chair]
    description: >
      Secretary sends committee meeting notice with date, time, location, and agenda
      to all committee members and den leaders.
    tags: [communications, administrative]

  - id: scoutbook-advancement-update
    name: "Scoutbook Advancement Updates"
    type: administrative
    frequency: monthly
    months: null
    timing_note: "Within 1–2 days of each den meeting"
    owner: den-leader
    roles: [den-leader]
    description: >
      Den leaders mark completed adventure requirements in Scoutbook promptly so the
      Advancement Chair can order awards and parents can see their Scout's progress.
    tags: [scoutbook, advancement, den]

  # ══════════════════════════════════════
  # JULY — Planning Month
  # ══════════════════════════════════════

  - id: annual-program-planning-conference
    name: "Annual Program Planning Conference"
    type: program
    frequency: annual
    months: [7]
    timing_note: "July or August; before the Scouting year begins"
    owner: cubmaster
    roles: [cubmaster, committee-chair, den-leader, assistant-cubmaster, activity-chair]
    description: >
      Annual meeting to set the pack's program calendar for the coming Scouting year.
      Sets pack meeting dates, themes, major events, and assigns activity coordinators.
    tags: [planning, annual]

  - id: prior-year-financial-report
    name: "Prior-Year Annual Financial Report"
    type: financial
    frequency: annual
    months: [7]
    timing_note: "July — close out the prior Scouting year finances"
    owner: treasurer
    roles: [treasurer]
    description: >
      Treasurer prepares the prior-year annual financial report summarizing all revenue,
      expenses, and account balances. Presented to the committee.
    tags: [financial, annual, reporting]

  - id: draft-annual-budget
    name: "Draft Upcoming-Year Budget"
    type: financial
    frequency: annual
    months: [7, 8]
    timing_note: "Draft in July, finalize in August, present for approval in September"
    owner: treasurer
    roles: [treasurer, committee-chair, cubmaster, advancement-chair, activity-chair]
    description: >
      Treasurer drafts the pack's budget for the coming Scouting year based on prior-year
      actuals, planned activities, expected enrollment, and popcorn revenue projections.
    tags: [financial, annual, budget]

  - id: leader-roster-review
    name: "Leader Roster Review"
    type: administrative
    frequency: annual
    months: [7]
    timing_note: "Early July to identify gaps before recruitment season"
    owner: committee-chair
    roles: [committee-chair, cubmaster]
    description: >
      Committee Chair reviews the full leader roster to identify vacant positions, roles
      at risk of turnover, and dens that will need new leadership for the coming year.
    tags: [leadership, administrative, annual]

  - id: summer-camp-confirmation
    name: "Summer Activity & Camp Confirmation"
    type: outdoor
    frequency: annual
    months: [7]
    timing_note: "Confirm council day camp and resident camp dates for families"
    owner: activity-chair
    roles: [activity-chair, cubmaster]
    description: >
      Confirm council day camp and resident camp programs and communicate dates to families.
      Coordinate any group pack attendance at summer programs.
    tags: [camp, summer, outdoor]

  - id: scout-rank-transitions
    name: "Scout Rank Transitions in Scoutbook"
    type: administrative
    frequency: annual
    months: [6, 7]
    timing_note: "June–July: update Scoutbook as Scouts move to the next rank's den"
    owner: den-leader
    roles: [den-leader, cubmaster]
    description: >
      Den leaders formally transition Scouts to the next rank (Wolves → Bears, etc.)
      in Scoutbook. Cubmaster coordinates crossover between den leaders.
    tags: [scoutbook, administrative, transitions]

  # ══════════════════════════════════════
  # AUGUST — Recruitment Prep
  # ══════════════════════════════════════

  - id: activities-fair
    name: "Community Activities Fair"
    type: recruitment
    frequency: annual
    months: [8]
    timing_note: "Typically late August — confirm Bethlehem Activities Fair date annually"
    owner: marketing-chair
    roles: [marketing-chair, membership-chair, cubmaster]
    description: >
      Pack 232 sets up a booth at community activities fairs (e.g., Bethlehem Activities Fair)
      to recruit prospective Scouts. Scouts in uniform attend. Contact info collected for follow-up.
    tags: [recruitment, visibility, community]

  - id: recruitment-materials-prep
    name: "Recruitment Materials Preparation"
    type: recruitment
    frequency: annual
    months: [8]
    timing_note: "Before school-night events and activities fairs"
    owner: marketing-chair
    roles: [marketing-chair, membership-chair]
    description: >
      Prepare recruitment fliers, sign-up forms, info packets, and branded materials
      for school-night events and activities fairs. Coordinate with Twin Rivers Council
      for BSA-produced materials (inflatable archery, display kits, etc.).
    tags: [recruitment, marketing]

  - id: glenmont-space-requests
    name: "Glenmont Elementary Space Requests"
    type: administrative
    frequency: annual
    months: [8]
    timing_note: "Submit before the school year starts for the full year of pack meeting dates"
    owner: committee-chair
    roles: [committee-chair]
    description: >
      Committee Chair submits space request forms to Glenmont Elementary for all monthly
      pack meeting dates, Pinewood Derby (gym), and any other events at the school.
    tags: [facilities, administrative, annual]

  - id: popcorn-unit-registration
    name: "Register Unit for Popcorn Sale"
    type: fundraising
    frequency: annual
    months: [8]
    timing_note: "Before the council popcorn kickoff in September"
    owner: popcorn-kernel
    roles: [popcorn-kernel]
    description: >
      Popcorn Kernel registers the pack with Twin Rivers Council for the annual popcorn sale
      and gains access to the Trail's End / Pecatonica ordering system.
    tags: [popcorn, fundraising, annual]

  - id: fall-activity-planning
    name: "Fall Activity Schedule Planning"
    type: outdoor
    frequency: annual
    months: [8]
    timing_note: "Confirm dates, sites, and coordinators before September kickoff"
    owner: activity-chair
    roles: [activity-chair, cubmaster, committee-chair]
    description: >
      Activities Chair confirms fall event schedule: Fall Back to Scouting date and site,
      ValleyCats Scout Night tickets, hike locations, and camping reservations.
    tags: [outdoor, planning, annual]

  # ══════════════════════════════════════
  # SEPTEMBER — Kickoff Month
  # ══════════════════════════════════════

  - id: school-night-recruitment
    name: "School-Night Recruitment Event"
    type: recruitment
    frequency: annual
    months: [9]
    timing_note: "Early-to-mid September, timed to school start"
    owner: membership-chair
    roles: [membership-chair, cubmaster, marketing-chair, den-leader]
    description: >
      Primary annual Scout recruitment event held at Glenmont Elementary. Cubmaster presents
      the Cub Scout program; families sign up on the spot. Follow up within 48 hours.
    tags: [recruitment, annual, kickoff]

  - id: new-family-orientation
    name: "New Family Orientation Meeting"
    type: recruitment
    frequency: annual
    months: [9, 10]
    timing_note: "Within first month after school-night recruitment"
    owner: membership-chair
    roles: [membership-chair, cubmaster, committee-chair]
    description: >
      Orientation meeting for families who joined through school-night recruitment.
      Covers Cub Scouting overview, Pack 232 structure, website, dues, uniforms, and Q&A.
    tags: [recruitment, onboarding, annual]

  - id: popcorn-council-kickoff
    name: "Popcorn Kernel Attends Council Kickoff"
    type: fundraising
    frequency: annual
    months: [9]
    timing_note: "Twin Rivers Council hosts kickoff — check trcscouting.org for date"
    owner: popcorn-kernel
    roles: [popcorn-kernel]
    description: >
      Popcorn Kernel attends the Twin Rivers Council annual popcorn kickoff meeting.
      Picks up sales materials, learns about prize program, and gets unit-level targets.
    tags: [popcorn, fundraising, annual]

  - id: popcorn-pack-kickoff
    name: "Popcorn Pack Kickoff Presentation"
    type: fundraising
    frequency: annual
    months: [9]
    timing_note: "At the September pack meeting"
    owner: popcorn-kernel
    roles: [popcorn-kernel, cubmaster]
    description: >
      Popcorn Kernel presents the popcorn sale to all Scouts and families at the September
      pack meeting. Explains goals, prizes, Scout account credits, take-order forms, and
      Show and Sell schedule.
    tags: [popcorn, fundraising, annual]

  - id: annual-budget-approval
    name: "Annual Budget Approval"
    type: financial
    frequency: annual
    months: [9]
    timing_note: "At the September committee meeting"
    owner: committee-chair
    roles: [committee-chair, treasurer]
    description: >
      Treasurer presents the proposed annual budget to the committee. Committee votes to approve.
      Budget governs all pack spending for the Scouting year.
    tags: [financial, annual, governance]

  - id: health-forms-collection
    name: "BSA Health Forms Collection"
    type: administrative
    frequency: annual
    months: [9]
    timing_note: "Collect at or before the September pack meeting"
    owner: secretary
    roles: [secretary, committee-chair]
    description: >
      Secretary collects BSA Annual Health and Medical Record (Parts A & B) for all Scouts
      and registered adults. Send reminders to families who have not submitted.
      Health forms expire annually.
    tags: [health-forms, administrative, annual]

  - id: dues-collection-setup
    name: "Annual Dues Collection"
    type: financial
    frequency: annual
    months: [9]
    timing_note: "Open collection at the September pack meeting"
    owner: treasurer
    roles: [treasurer, committee-chair]
    description: >
      Treasurer opens WooCommerce products for annual Scout dues collection. Accepts payment
      via WooCommerce (online), Square (in-person card), Venmo, or check.
    tags: [financial, dues, annual]

  # ══════════════════════════════════════
  # OCTOBER — Popcorn & Fall Activities
  # ══════════════════════════════════════

  - id: popcorn-show-and-sells
    name: "Popcorn Show & Sells"
    type: fundraising
    frequency: annual
    months: [9, 10]
    timing_note: "Multiple weekends in September–October; Kernel schedules with merchants"
    owner: popcorn-kernel
    roles: [popcorn-kernel, cubmaster]
    description: >
      Scouts staff tables in front of local merchants (grocery stores, etc.) and sell popcorn
      directly to customers. Kernel schedules shifts and coordinates inventory.
    tags: [popcorn, fundraising, annual]

  - id: popcorn-order-submission
    name: "Popcorn Order Submission to Council"
    type: fundraising
    frequency: annual
    months: [10]
    timing_note: "By the council's deadline — check trcscouting.org annually"
    owner: popcorn-kernel
    roles: [popcorn-kernel, treasurer]
    description: >
      Popcorn Kernel collects all Scout take-order forms, enters the pack's order into the
      Trail's End / Pecatonica system, and submits to Twin Rivers Council District Office
      by the annual deadline.
    tags: [popcorn, fundraising, annual, deadline]

  - id: popcorn-money-collection
    name: "Popcorn Money Collection & Turnover"
    type: fundraising
    frequency: annual
    months: [10]
    timing_note: "Concurrent with order submission"
    owner: popcorn-kernel
    roles: [popcorn-kernel, treasurer]
    description: >
      Popcorn Kernel collects popcorn proceeds from Scout families. All money turned over
      to the Treasurer. Kernel provides per-Scout sales data for Scout account credits.
    tags: [popcorn, financial, annual]

  - id: fall-back-to-scouting
    name: "Fall Back to Scouting"
    type: outdoor
    frequency: annual
    months: [10]
    timing_note: "October — confirm date and site annually"
    owner: activity-chair
    roles: [activity-chair]
    description: >
      Annual fall camping or outdoor event. Reserve site/cabin in advance.
      Procure food and supplies. Coordinate with Cubmaster for program elements.
      Coordinators: Ben Friedman & Hank Tripp.
    tags: [camping, outdoor, annual]

  - id: valleycats-scout-night
    name: "ValleyCats Scout Night"
    type: outdoor
    frequency: annual
    months: [10]
    timing_note: "Check ValleyCats schedule annually — may be summer or fall"
    owner: activity-chair
    roles: [activity-chair]
    description: >
      Group outing to a Tri-City ValleyCats baseball game. Reserve group tickets in advance.
      Coordinator: Jara Traina.
    tags: [outing, outdoor, annual]

  - id: recharter-roster-pull
    name: "Recharter: Pull Current Roster"
    type: administrative
    frequency: annual
    months: [10]
    timing_note: "Early October — start recharter process as soon as portal opens"
    owner: committee-chair
    roles: [committee-chair, secretary]
    description: >
      Committee Chair pulls the current pack roster from my.Scouting.org and begins
      review: confirm active Scouts and adults, identify those to remove or add.
    tags: [recharter, administrative, annual]

  - id: recharter-ypt-check
    name: "Recharter: YPT Status Check"
    type: administrative
    frequency: annual
    months: [10]
    timing_note: "Check training status for all adults in my.Scouting.org"
    owner: committee-chair
    roles: [committee-chair, secretary]
    description: >
      Verify that all registered adults have current Youth Protection Training (YPT).
      Contact anyone with lapsed YPT — they must retake before recharter submits.
    tags: [recharter, training, ypt, annual]

  # ══════════════════════════════════════
  # NOVEMBER — Popcorn Close & Recharter
  # ══════════════════════════════════════

  - id: popcorn-pickup-distribution
    name: "Popcorn Pickup & Distribution"
    type: fundraising
    frequency: annual
    months: [11]
    timing_note: "November — after council distributes popcorn to district"
    owner: popcorn-kernel
    roles: [popcorn-kernel]
    description: >
      Popcorn Kernel picks up the pack's popcorn from the district, sorts it by Scout,
      and distributes to Scout families at a pack meeting or designated pickup.
    tags: [popcorn, fundraising, annual]

  - id: scout-account-credits
    name: "Scout Account Credits from Popcorn"
    type: financial
    frequency: annual
    months: [11]
    timing_note: "After popcorn proceeds are received from the Kernel"
    owner: treasurer
    roles: [treasurer, popcorn-kernel]
    description: >
      Treasurer credits individual Scout accounts in QuickBooks based on per-Scout popcorn
      sales data provided by the Popcorn Kernel.
    tags: [financial, scout-accounts, popcorn, annual]

  - id: popcorn-year-end-wrap
    name: "Popcorn Kernel Attends Year-End Wrap"
    type: fundraising
    frequency: annual
    months: [11]
    timing_note: "Twin Rivers Council hosts wrap meeting — check trcscouting.org for date"
    owner: popcorn-kernel
    roles: [popcorn-kernel]
    description: >
      Popcorn Kernel attends the council's year-end popcorn wrap meeting to close out
      the sale season, reconcile any issues, and prepare for next year.
    tags: [popcorn, fundraising, annual]

  - id: popcorn-donation-in-lieu-invoicing
    name: "Popcorn Donation-in-Lieu Invoicing"
    type: financial
    frequency: annual
    months: [11]
    timing_note: "After Scout account credits are calculated"
    owner: treasurer
    roles: [treasurer, popcorn-kernel]
    description: >
      Treasurer invoices Scout families who did not meet the popcorn target for
      "donation in lieu" — additional dues owed to make up the fundraising shortfall.
    tags: [financial, popcorn, dues, annual]

  - id: scouting-for-food
    name: "Scouting for Food"
    type: service
    frequency: annual
    months: [11]
    timing_note: "Typically November — coordinate with district for area assignment"
    owner: service-chair
    roles: [service-chair, cubmaster, activity-chair]
    description: >
      Annual BSA food drive. Scouts collect canned goods door-to-door in assigned areas.
      Coordinate area assignments with district/other packs, arrange food pantry drop-off,
      provide bags and door hangers. Lead coordinator: Kara Giglia.
    tags: [service, annual, food-drive]

  - id: recharter-adult-applications
    name: "Recharter: Collect & Route Adult Applications"
    type: administrative
    frequency: annual
    months: [10, 11]
    timing_note: "October–November — concurrent with roster review"
    owner: secretary
    roles: [secretary, committee-chair, charter-org-rep]
    description: >
      Secretary collects adult applications (with YPT certificates) for any new or
      previously unregistered adults. Routes to Charter Org Rep for signature.
    tags: [recharter, administrative, annual]

  - id: recharter-cor-signs
    name: "Recharter: Charter Org Rep Signs Applications & Roster"
    type: administrative
    frequency: annual
    months: [11]
    timing_note: "Before recharter submission — COR must sign all adult applications"
    owner: charter-org-rep
    roles: [charter-org-rep, committee-chair]
    description: >
      Charter Org Rep reviews and signs all adult applications and the completed
      recharter roster before submission to Twin Rivers Council.
    tags: [recharter, administrative, annual]

  - id: journey-to-excellence
    name: "Journey to Excellence Documentation"
    type: administrative
    frequency: annual
    months: [11]
    timing_note: "Complete with recharter; submitted to council"
    owner: committee-chair
    roles: [committee-chair, cubmaster]
    description: >
      Committee Chair completes the annual Journey to Excellence (JtE) documentation
      measuring pack performance across advancement, membership, training, service, and program.
    tags: [recharter, administrative, annual, jtE]

  # ══════════════════════════════════════
  # DECEMBER — Charter Submission & Caroling
  # ══════════════════════════════════════

  - id: recharter-submission
    name: "Recharter Submission to Council"
    type: administrative
    frequency: annual
    months: [12]
    timing_note: "December deadline — confirm exact date with Twin Rivers Council each year"
    owner: committee-chair
    roles: [committee-chair, charter-org-rep, treasurer]
    description: >
      Committee Chair submits completed recharter to Twin Rivers Council. Charter Org Rep
      signs. Treasurer pays recharter fees.
    tags: [recharter, administrative, annual, deadline]

  - id: caroling
    name: "Caroling"
    type: service
    frequency: annual
    months: [12]
    timing_note: "December — coordinate with neighbors in advance"
    owner: service-chair
    roles: [service-chair, cubmaster]
    description: >
      Scouts carol in the neighborhood. Coordinator arranges prepared neighbors, procures
      hot chocolate for Scouts afterward, and delivers any monetary proceeds to the
      beneficiary selected by the Pack Committee. Coordinator: Hank Tripp.
    tags: [service, holiday, annual]

  - id: holiday-pack-meeting
    name: "Holiday Pack Meeting"
    type: program
    frequency: annual
    months: [12]
    timing_note: "December pack meeting"
    owner: cubmaster
    roles: [cubmaster, den-leader]
    description: >
      Holiday-themed pack meeting. May include skits, songs, advancement ceremonies,
      and holiday celebration activities.
    tags: [program, holiday, annual]

  - id: quickbooks-license-renewal
    name: "QuickBooks / TechSoup License Renewal"
    type: financial
    frequency: annual
    months: [12]
    timing_note: "Check renewal date annually — may vary"
    owner: treasurer
    roles: [treasurer]
    description: >
      Treasurer renews the QuickBooks Online license through TechSoup (nonprofit discount
      program) for the coming year.
    tags: [financial, administrative, annual]

  - id: blue-gold-venue-booking
    name: "Blue & Gold Banquet: Venue & Date Booking"
    type: program
    frequency: annual
    months: [12]
    timing_note: "Book venue by December for a February event"
    owner: committee-chair
    roles: [committee-chair, activity-chair]
    description: >
      Confirm the Blue & Gold Banquet venue (Glenmont Elementary gym or alternative),
      date, and any entertainment the committee selects.
    tags: [blue-gold, program, planning, annual]

  - id: pinewood-derby-gym-reservation
    name: "Pinewood Derby: Gym Reservation"
    type: program
    frequency: annual
    months: [12]
    timing_note: "Book by December for a March event"
    owner: committee-chair
    roles: [committee-chair, pinewood-derby-team]
    description: >
      Committee Chair reserves Glenmont Elementary gym for the Pinewood Derby.
      Pinewood Derby Team sets the date and confirms with Committee Chair.
    tags: [pinewood-derby, facilities, annual]

  - id: aol-crossover-planning
    name: "Arrow of Light Crossover: Troop Coordination"
    type: recognition
    frequency: annual
    months: [12]
    timing_note: "December planning for January/February crossover"
    owner: cubmaster
    roles: [cubmaster, den-leader]
    description: >
      Cubmaster and AOL den leader confirm which Scouts BSA troop(s) AOL Scouts will join.
      Plan crossover ceremony with Scoutmaster and troop youth leaders. Target January or
      February so Scouts can attend troop campouts before summer camp.
    tags: [crossover, aol, recognition, annual]

  # ══════════════════════════════════════
  # JANUARY — Charter Ceremony & Crossover
  # ══════════════════════════════════════

  - id: charter-presentation-ceremony
    name: "Charter Presentation Ceremony"
    type: administrative
    frequency: annual
    months: [1]
    timing_note: "January pack meeting — formal renewal of the pack's charter"
    owner: committee-chair
    roles: [committee-chair, charter-org-rep, cubmaster]
    description: >
      Formal ceremony at the pack meeting in which the new charter is presented to the pack
      by the Charter Org Rep, renewing the pack's sanction for the new year.
    tags: [charter, administrative, annual, ceremony]

  - id: aol-crossover-ceremony
    name: "Arrow of Light Crossover Ceremony"
    type: recognition
    frequency: annual
    months: [1, 2]
    timing_note: "January target (February latest); at a pack meeting"
    owner: cubmaster
    roles: [cubmaster, den-leader, advancement-chair]
    description: >
      Scouts who have earned the Arrow of Light badge cross over to a Scouts BSA troop.
      Ceremony involves Scoutmaster and troop youth leaders. Advancement Chair orders AOL
      badges and certificates well in advance.
    tags: [crossover, aol, recognition, annual, ceremony]

  - id: blue-gold-final-planning
    name: "Blue & Gold Banquet: Final Planning"
    type: program
    frequency: annual
    months: [1]
    timing_note: "January — finalize food, entertainment, program before February event"
    owner: activity-chair
    roles: [activity-chair, committee-chair, cubmaster]
    description: >
      Finalize all Blue & Gold Banquet details: food order, entertainment, ceremony program,
      invitations, hospitality setup (drinks, paper goods). Coordinators: Becky D'Anza,
      Andrea Dievendorf, Lindsay Knott, Kara Giglia.
    tags: [blue-gold, planning, annual]

  - id: new-family-retention-checkin
    name: "New Family Retention Check-In"
    type: recruitment
    frequency: annual
    months: [1]
    timing_note: "January — 4 months after September recruitment"
    owner: membership-chair
    roles: [membership-chair, cubmaster, den-leader]
    description: >
      Membership Chair checks in with families who joined in September — are they engaged?
      Flag any at risk of dropping out and initiate personal outreach.
    tags: [retention, recruitment, annual]

  # ══════════════════════════════════════
  # FEBRUARY — Blue & Gold Banquet
  # ══════════════════════════════════════

  - id: blue-gold-banquet
    name: "Blue & Gold Banquet"
    type: program
    frequency: annual
    months: [2]
    timing_note: "February — the pack's largest annual celebration"
    owner: blue-gold-team
    roles: [blue-gold-team, committee-chair, cubmaster, activity-chair, advancement-chair]
    description: >
      Annual Blue & Gold Banquet celebrating Cub Scouting's founding. Recognizes Scout
      accomplishments, honors leaders, includes advancement ceremonies and entertainment.
      Coordinators: Becky D'Anza, Andrea Dievendorf, Lindsay Knott, Kara Giglia.
    tags: [blue-gold, program, annual, celebration]

  - id: next-year-lion-recruitment
    name: "Next-Year Lion Den Recruitment"
    type: recruitment
    frequency: annual
    months: [2]
    timing_note: "February — begin recruiting incoming kindergartners for next fall"
    owner: membership-chair
    roles: [membership-chair, cubmaster]
    description: >
      Begin recruiting families with incoming kindergartners (current Pre-K) for next
      year's Lion den. Connect with Glenmont Elementary for outreach opportunities.
    tags: [recruitment, lions, annual]

  - id: next-year-leadership-recruitment
    name: "Next-Year Den Leadership Recruitment"
    type: administrative
    frequency: annual
    months: [2]
    timing_note: "February — identify and recruit before end of school year"
    owner: committee-chair
    roles: [committee-chair, cubmaster]
    description: >
      Identify dens that will need new leadership next year (leader's child crossing over,
      etc.) and begin recruiting replacements from current den families.
    tags: [leadership, recruitment, annual]

  # ══════════════════════════════════════
  # MARCH — Pinewood Derby
  # ══════════════════════════════════════

  - id: pinewood-derby-kit-distribution
    name: "Pinewood Derby: Kit Purchase & Distribution"
    type: program
    frequency: annual
    months: [3]
    timing_note: "Early March — 4–6 weeks before race day"
    owner: pinewood-derby-team
    roles: [pinewood-derby-team, committee-chair]
    description: >
      Pinewood Derby Team purchases Pinewood Derby kits for all Scouts (and Lego Derby
      kits for Lions). Distributes kits at a pack meeting or den meetings.
      Lead: Jeff Middendorf. Team: Dave Coup, Gary Robbins, Jeff Dievendorf, Charles Giglia, Chris Orth.
    tags: [pinewood-derby, program, annual]

  - id: pinewood-derby-rules
    name: "Pinewood Derby: Rules Distribution"
    type: program
    frequency: annual
    months: [3]
    timing_note: "With kit distribution"
    owner: pinewood-derby-team
    roles: [pinewood-derby-team]
    description: >
      Pinewood Derby Team develops and distributes race rules including weight limits,
      size restrictions, and Best in Show judging criteria.
    tags: [pinewood-derby, program, annual]

  - id: pinewood-derby-event
    name: "Pinewood Derby Race"
    type: program
    frequency: annual
    months: [3]
    timing_note: "March — at Glenmont Elementary gym"
    owner: pinewood-derby-team
    roles: [pinewood-derby-team, committee-chair, advancement-chair, activity-chair]
    description: >
      Annual Pinewood Derby race. Team sets up track and timing system, manages car check-in,
      runs the race, empanels judges for Best in Show, and distributes awards.
    tags: [pinewood-derby, program, annual, event]

  - id: pinewood-derby-track-storage
    name: "Pinewood Derby: Track Storage"
    type: administrative
    frequency: annual
    months: [3]
    timing_note: "Immediately after the race"
    owner: pinewood-derby-team
    roles: [pinewood-derby-team, committee-chair]
    description: >
      Committee Chair and Pinewood Derby Team arrange year-round storage of the
      Pinewood Derby track and timing system.
    tags: [pinewood-derby, administrative, facilities, annual]

  - id: spring-hike-planning
    name: "Spring Hike Planning"
    type: outdoor
    frequency: annual
    months: [3]
    timing_note: "Plan in March for an April event"
    owner: activity-chair
    roles: [activity-chair]
    description: >
      Identify hiking site, check trail conditions, obtain any permits, plan logistics
      and transportation. Coordinator: Dave Coup.
    tags: [hike, outdoor, annual]

  # ══════════════════════════════════════
  # APRIL — Spring Hike & Budget Review
  # ══════════════════════════════════════

  - id: spring-hike
    name: "Spring Hike"
    type: outdoor
    frequency: annual
    months: [4]
    timing_note: "April — all dens attend"
    owner: activity-chair
    roles: [activity-chair, cubmaster, den-leader]
    description: >
      Annual spring hike open to all dens and families. Coordinator: Dave Coup.
    tags: [hike, outdoor, annual]

  - id: budget-review
    name: "Mid-Year Budget Review"
    type: financial
    frequency: annual
    months: [4]
    timing_note: "April committee meeting"
    owner: treasurer
    roles: [treasurer, committee-chair]
    description: >
      Treasurer presents actuals vs. budget review for the year to date.
      Identifies variances and any risks to year-end financial position.
    tags: [financial, annual, budget]

  - id: jtE-progress-check
    name: "Journey to Excellence Progress Check"
    type: administrative
    frequency: annual
    months: [4]
    timing_note: "April — with enough time to improve before year-end"
    owner: committee-chair
    roles: [committee-chair, cubmaster]
    description: >
      Committee Chair reviews where the pack stands on Journey to Excellence criteria
      (advancement rates, membership, training, service hours). Identifies any areas
      needing attention before the year closes.
    tags: [administrative, jtE, annual]

  - id: spring-service-project
    name: "Spring Service Project"
    type: service
    frequency: as-needed
    months: [4]
    timing_note: "Optional — good month for a neighborhood or park cleanup"
    owner: service-chair
    roles: [service-chair, cubmaster, den-leader]
    description: >
      Optional spring service project (e.g., park cleanup, trail maintenance, school
      grounds cleanup). Service Chair coordinates with the beneficiary and plans logistics.
    tags: [service, outdoor, spring]

  # ══════════════════════════════════════
  # MAY — Year-End Push
  # ══════════════════════════════════════

  - id: parent-skills-survey
    name: "Parent Annual Skills & Program Survey"
    type: administrative
    frequency: annual
    months: [5]
    timing_note: "May — capture family talents before summer"
    owner: committee-chair
    roles: [committee-chair, membership-chair, cubmaster]
    description: >
      Collect input from all pack families on skills, availability, and program preferences
      for the coming year. Used to recruit activity coordinators and plan next year's program.
    tags: [administrative, planning, annual, survey]

  - id: final-advancement-push
    name: "Final Advancement Push"
    type: recognition
    frequency: annual
    months: [5]
    timing_note: "May — ensure all Scouts complete rank badges before year-end"
    owner: advancement-chair
    roles: [advancement-chair, den-leader, cubmaster]
    description: >
      Advancement Chair and den leaders identify Scouts close to completing their rank badge
      and work with families to complete any remaining requirements before the end of year.
    tags: [advancement, recognition, annual]

  - id: end-of-year-pack-meeting
    name: "End-of-Year Pack Meeting"
    type: program
    frequency: annual
    months: [5]
    timing_note: "May pack meeting — celebrate the year's accomplishments"
    owner: cubmaster
    roles: [cubmaster, advancement-chair, den-leader, committee-chair]
    description: >
      Final pack meeting of the Scouting year. Recognize all Scouts with remaining
      advancement awards, celebrate the year, thank volunteers, and preview next year.
    tags: [program, annual, celebration]

  - id: retention-outreach
    name: "End-of-Year Retention Outreach"
    type: recruitment
    frequency: annual
    months: [5]
    timing_note: "Before families disengage for summer"
    owner: membership-chair
    roles: [membership-chair, cubmaster, den-leader]
    description: >
      Membership Chair and den leaders identify families showing low engagement and
      make personal outreach to encourage re-enrollment for the coming year.
    tags: [retention, recruitment, annual]

  # ══════════════════════════════════════
  # JUNE — Year-End Admin
  # ══════════════════════════════════════

  - id: records-archival
    name: "Year-End Records Archival"
    type: administrative
    frequency: annual
    months: [6]
    timing_note: "June — archive before summer"
    owner: secretary
    roles: [secretary]
    description: >
      Secretary archives the year's records to Google Drive: health forms, meeting minutes,
      consent forms, adult applications, and other key documents.
    tags: [administrative, records, annual]

  - id: financial-year-close
    name: "Prior-Year Financial Close"
    type: financial
    frequency: annual
    months: [6, 7]
    timing_note: "Begin in June; complete by July"
    owner: treasurer
    roles: [treasurer]
    description: >
      Treasurer finalizes the prior Scouting year's financial close in QuickBooks:
      reconcile all accounts, close the year, and prepare for the annual report in July.
    tags: [financial, annual]

  - id: fall-hike-planning
    name: "Fall Hike Planning"
    type: outdoor
    frequency: annual
    months: [6]
    timing_note: "Plan in June/July for a September/October event"
    owner: activity-chair
    roles: [activity-chair]
    description: >
      Identify fall hike site, check permits, coordinate with Cubmaster.
      Coordinator: Dave Coup.
    tags: [hike, outdoor, annual, planning]

  - id: year-end-leader-checkin
    name: "Year-End Den Leader Check-In"
    type: administrative
    frequency: annual
    months: [6]
    timing_note: "Informal — before leaders go on summer break"
    owner: cubmaster
    roles: [cubmaster, committee-chair]
    description: >
      Cubmaster conducts informal check-ins with each den leader: how did the year go,
      are they returning, any concerns for next year? Flags retention risks for Committee Chair.
    tags: [administrative, leadership, annual]

  # ══════════════════════════════════════
  # AS-NEEDED / ONGOING
  # ══════════════════════════════════════

  - id: ypt-renewal-tracking
    name: "YPT Renewal Tracking"
    type: training
    frequency: as-needed
    months: null
    timing_note: "YPT expires every 2 years; track and remind leaders proactively"
    owner: secretary
    roles: [secretary, committee-chair]
    description: >
      Secretary tracks YPT expiration dates for all registered adults and alerts the
      Committee Chair when renewals are needed. Any adult with lapsed YPT must renew
      before participating in Scouting activities.
    tags: [training, ypt, administrative]

  - id: leadership-vacancy-fill
    name: "Leadership Vacancy Recruitment"
    type: administrative
    frequency: as-needed
    months: null
    timing_note: "As vacancies arise throughout the year"
    owner: committee-chair
    roles: [committee-chair, cubmaster, charter-org-rep]
    description: >
      Committee Chair and Cubmaster identify and recruit replacements for any vacant
      leadership positions. New adults complete adult application and YPT before serving.
    tags: [leadership, recruitment, administrative]

  - id: new-scout-onboarding
    name: "New Scout Mid-Year Onboarding"
    type: recruitment
    frequency: as-needed
    months: null
    timing_note: "As new Scouts join at any point during the year"
    owner: membership-chair
    roles: [membership-chair, den-leader]
    description: >
      Scouts can join at any time. Membership Chair connects new families to their den leader,
      provides welcome packet, and ensures health form and registration are complete.
    tags: [recruitment, onboarding]

  - id: reimbursement-processing
    name: "Leader Reimbursement Processing"
    type: financial
    frequency: as-needed
    months: null
    timing_note: "As expenses are submitted; Committee Chair approves before Treasurer pays"
    owner: treasurer
    roles: [treasurer, committee-chair]
    description: >
      Leaders submit receipts for pack-related expenses. Committee Chair approves.
      Treasurer issues reimbursement check from Broadview account.
    tags: [financial, reimbursements]

  - id: money-earning-application
    name: "BSA Unit Money-Earning Application"
    type: fundraising
    frequency: as-needed
    months: null
    timing_note: "Required before any non-popcorn fundraising activity begins"
    owner: fundraising-chair
    roles: [fundraising-chair, committee-chair, charter-org-rep]
    description: >
      Approval from both the charter organization and Twin Rivers Council is required
      before any fundraising activity other than the annual popcorn sale. Fundraising Chair
      prepares the application; Charter Org Rep and Council must approve before any activity begins.
    tags: [fundraising, administrative, bsa-policy]

  - id: facebook-event-posting
    name: "Facebook Event Posting"
    type: administrative
    frequency: monthly
    months: null
    timing_note: "At least 2 weeks before each pack meeting or major event"
    owner: marketing-chair
    roles: [marketing-chair]
    description: >
      Marketing Chair creates Facebook events for pack meetings and outings with date,
      time, location, and description. Shares event recap and photos within 1–2 days after.
    tags: [communications, social-media, marketing]

  - id: service-hours-reporting
    name: "Service Hours Reporting to Council"
    type: administrative
    frequency: as-needed
    months: null
    timing_note: "After each service project"
    owner: committee-chair
    roles: [committee-chair, service-chair]
    description: >
      Committee Chair reports pack and den service hours to Twin Rivers Council after
      each service project. Service Chair provides participant count and hours summary.
    tags: [service, administrative, reporting]

  - id: nys-sales-tax-exemption
    name: "NY Sales Tax Exemption on Pack Purchases"
    type: financial
    frequency: as-needed
    months: null
    timing_note: "Any time a significant pack purchase is made"
    owner: treasurer
    roles: [treasurer]
    description: >
      Pack 232 is exempt from New York State sales tax on pack purchases. Treasurer provides
      the tax-exempt certificate to leaders before significant purchases. Keep receipt
      showing tax was not charged.
    tags: [financial, administrative, tax]
